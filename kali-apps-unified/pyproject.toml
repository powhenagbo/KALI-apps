[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kali-apps"
version = "1.0.0"
description = "KALI genome analysis CLI toolkit (k-mer hashing, distance trees, tensor labeling, genome downloading, and related tools)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "biopython>=1.81",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "dendropy>=4.6",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "seaborn>=0.12",
]

[project.optional-dependencies]
# Only needed if you also want to run the Flask web UI (app.py) instead of
# the CLI tools. Not required for any command below.
web = ["flask>=3.0", "gunicorn>=21.0"]

[project.scripts]
pykali_hash            = "kali_apps.pykali_hash:main"
"KALI_non-hash"        = "kali_apps.KALI_non_hash:main"
KALI_hash              = "kali_apps.KALI_hash:main"
kali-tree              = "kali_apps.kali_tree:main"
kali-tensor            = "kali_apps.kali_tensor:main"
kali-downloader        = "kali_apps.kali_downloader:main"
kali-prepare-metadata  = "kali_apps.prepare_metadata:main"
kali-rf-distance       = "kali_apps._cli_shims:rf_distance_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
